name: Report pull-request contrast findings

on:
  workflow_run:
    workflows: ["Site Validation"]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

concurrency:
  group: contrast-report-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  report:
    name: Update pull-request contrast feedback
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest

    steps:
      - name: Find the current pull request
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const repository = context.payload.repository.full_name;
            let pullRequestReferences = run.pull_requests || [];

            if (!pullRequestReferences.length) {
              try {
                pullRequestReferences = await github.paginate(
                  github.rest.repos.listPullRequestsAssociatedWithCommit,
                  {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    commit_sha: run.head_sha,
                  },
                );
              } catch (error) {
                core.warning(`Could not resolve the pull request: ${error.message}`);
                return;
              }
            }

            let pullRequest = null;
            for (const candidate of pullRequestReferences) {
              if (!candidate.number) continue;
              const { data } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: candidate.number,
              });
              if (
                data.state === 'open' &&
                data.head?.repo?.full_name &&
                data.head.sha === run.head_sha
              ) {
                pullRequest = data;
                break;
              }
            }
            if (!pullRequest) {
              core.info('The pull request no longer points to this workflow run.');
              return;
            }

            core.setOutput('number', String(pullRequest.number));
            core.setOutput('head_sha', pullRequest.head.sha);
            core.setOutput('head_owner', pullRequest.head.repo.owner.login);
            core.setOutput('head_repo', pullRequest.head.repo.name);
            core.setOutput(
              'is_fork',
              String(pullRequest.head.repo.full_name !== repository),
            );

      - name: Download contrast audit report
        if: steps.pr.outputs.number != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: contrast-audit-${{ github.event.workflow_run.id }}
          path: contrast-audit
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update contrast feedback without executing pull-request code
        if: steps.pr.outputs.number != ''
        uses: actions/github-script@v7
        env:
          CONTRAST_REPORT: contrast-audit/contrast-report.txt
          CONTRAST_EXIT_CODE: contrast-audit/contrast-exit-code.txt
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          HEAD_OWNER: ${{ steps.pr.outputs.head_owner }}
          HEAD_REPO: ${{ steps.pr.outputs.head_repo }}
          IS_FORK: ${{ steps.pr.outputs.is_fork }}
        with:
          script: |
            const fs = require('fs');
            const reportPath = process.env.CONTRAST_REPORT;
            const exitCodePath = process.env.CONTRAST_EXIT_CODE;
            const maxArtifactBytes = 64 * 1024;
            if (
              !fs.existsSync(reportPath) ||
              !fs.existsSync(exitCodePath) ||
              fs.statSync(reportPath).size > maxArtifactBytes ||
              fs.statSync(exitCodePath).size > 32
            ) {
              core.warning('No valid contrast artifact was available for this workflow run.');
              return;
            }

            const report = fs.readFileSync(reportPath, 'utf8').trim();
            const auditFailed = fs.readFileSync(exitCodePath, 'utf8').trim() !== '0';
            const failedLines = report
              .split('\n')
              .filter((line) => /^\s*FAIL\b/.test(line));
            const failurePattern =
              /^\s*FAIL\s+\[([^\]]+)\]\s+(--[\w-]+).*?\s+on\s+(--[\w-]+).*?→\s+([0-9.]+):1\s+\(min\s+([0-9.]+):1/;
            const failures = failedLines
              .map((raw) => {
                const match = raw.match(failurePattern);
                return match && {
                  raw: raw.trim(),
                  theme: match[1],
                  foreground: match[2],
                  background: match[3],
                  ratio: match[4],
                  minimum: match[5],
                };
              })
              .filter(Boolean);

            const { owner, repo } = context.repo;
            const pull_number = Number(process.env.PR_NUMBER);
            const headSha = process.env.HEAD_SHA;
            const isFork = process.env.IS_FORK === 'true';
            const summaryMarker = '<!-- contrast-audit-summary -->';
            const legacySummaryMarker = '<!-- contrast-audit-comment -->';
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number: pull_number, per_page: 100 },
            );
            const existingSummaryComments = comments.filter(
              (comment) =>
                comment.user?.type === 'Bot' &&
                (
                  comment.body?.includes(summaryMarker) ||
                  comment.body?.includes(legacySummaryMarker)
                ),
            );

            let unmappedFailures = [...failures];
            if (!isFork) {
              let cssLines = [];
              try {
                const { data } = await github.rest.repos.getContent({
                  owner: process.env.HEAD_OWNER,
                  repo: process.env.HEAD_REPO,
                  path: 'assets/css/theme.css',
                  ref: headSha,
                });
                if (!Array.isArray(data) && data.type === 'file') {
                  cssLines = Buffer.from(data.content, 'base64').toString('utf8').split('\n');
                }
              } catch (error) {
                core.warning(`Could not read PR CSS for inline mapping: ${error.message}`);
              }

              function changedLinesFromPatch(patch) {
                const changedLines = [];
                let newLine = null;
                for (const patchLine of (patch || '').split('\n')) {
                  const hunk = patchLine.match(
                    /^@@ -\d+(?:,\d+)? \+(\d+)(?:,\d+)? @@/,
                  );
                  if (hunk) {
                    newLine = Number(hunk[1]);
                    continue;
                  }
                  if (newLine === null) continue;
                  if (patchLine.startsWith('+') && !patchLine.startsWith('+++')) {
                    changedLines.push({ line: newLine, text: patchLine.slice(1) });
                    newLine += 1;
                  } else if (!patchLine.startsWith('-') && !patchLine.startsWith('\\')) {
                    newLine += 1;
                  }
                }
                return changedLines;
              }

              function themeAtLine(lineNumber) {
                for (let index = lineNumber - 1; index >= 0; index -= 1) {
                  const sourceLine = cssLines[index];
                  if (/:root\[data-theme=["']light["']\]/.test(sourceLine)) {
                    return 'light';
                  }
                  if (/^\s*:root\s*\{/.test(sourceLine)) return 'dark';
                }
                return null;
              }

              const files = await github.paginate(
                github.rest.pulls.listFiles,
                { owner, repo, pull_number, per_page: 100 },
              );
              const themeFile = files.find(
                (file) => file.filename === 'assets/css/theme.css',
              );
              const changedDeclarations = themeFile
                ? changedLinesFromPatch(themeFile.patch)
                    .map(({ line, text }) => {
                      const token = text.match(/^\s*(--[\w-]+)\s*:/)?.[1];
                      const theme = token && themeAtLine(line);
                      return token && theme
                        ? { path: 'assets/css/theme.css', line, token, theme }
                        : null;
                    })
                    .filter(Boolean)
                : [];

              const annotationGroups = new Map();
              unmappedFailures = [];
              for (const failure of failures) {
                const declaration = changedDeclarations.find(
                  (candidate) =>
                    candidate.theme === failure.theme &&
                    candidate.token === failure.foreground,
                ) || changedDeclarations.find(
                  (candidate) =>
                    candidate.theme === failure.theme &&
                    candidate.token === failure.background,
                );
                if (!declaration) {
                  unmappedFailures.push(failure);
                  continue;
                }
                const key = `${declaration.theme}:${declaration.token}`;
                if (!annotationGroups.has(key)) {
                  annotationGroups.set(key, { declaration, failures: [] });
                }
                annotationGroups.get(key).failures.push(failure);
              }

              const reviewComments = await github.paginate(
                github.rest.pulls.listReviewComments,
                { owner, repo, pull_number, per_page: 100 },
              );
              const inlineMarkerPrefix = '<!-- contrast-audit-inline:';
              const existingInlineComments = reviewComments.filter(
                (comment) =>
                  comment.user?.type === 'Bot' &&
                  comment.body?.includes(inlineMarkerPrefix),
              );
              const desiredMarkers = new Set();

              for (const [key, group] of annotationGroups) {
                const marker = `<!-- contrast-audit-inline:${key} -->`;
                desiredMarkers.add(marker);
                const body = [
                  marker,
                  '**WCAG contrast failure**',
                  '',
                  ...group.failures.map(
                    (failure) =>
                      `- \`${failure.foreground}\` on \`${failure.background}\`: **${failure.ratio}:1** (minimum **${failure.minimum}:1**)`,
                  ),
                ].join('\n');
                const matches = existingInlineComments.filter(
                  (comment) => comment.body?.includes(marker),
                );
                const existing = matches.shift();

                for (const duplicate of matches) {
                  await github.rest.pulls.deleteReviewComment({
                    owner,
                    repo,
                    comment_id: duplicate.id,
                  });
                }

                if (
                  existing &&
                  existing.path === group.declaration.path &&
                  existing.line === group.declaration.line &&
                  existing.side === 'RIGHT' &&
                  existing.commit_id === headSha
                ) {
                  await github.rest.pulls.updateReviewComment({
                    owner,
                    repo,
                    comment_id: existing.id,
                    body,
                  });
                } else {
                  if (existing) {
                    await github.rest.pulls.deleteReviewComment({
                      owner,
                      repo,
                      comment_id: existing.id,
                    });
                  }
                  await github.rest.pulls.createReviewComment({
                    owner,
                    repo,
                    pull_number,
                    body,
                    commit_id: headSha,
                    path: group.declaration.path,
                    line: group.declaration.line,
                    side: 'RIGHT',
                  });
                }
              }

              for (const comment of existingInlineComments) {
                const marker = comment.body.match(
                  /<!-- contrast-audit-inline:[^>]+ -->/,
                )?.[0];
                if (marker && !desiredMarkers.has(marker)) {
                  await github.rest.pulls.deleteReviewComment({
                    owner,
                    repo,
                    comment_id: comment.id,
                  });
                }
              }
            }

            if (!auditFailed) {
              for (const comment of existingSummaryComments) {
                await github.rest.issues.deleteComment({
                  owner,
                  repo,
                  comment_id: comment.id,
                });
              }
              return;
            }

            const summaryFailures = isFork ? failures : unmappedFailures;
            if (!isFork && !summaryFailures.length && failures.length) {
              for (const comment of existingSummaryComments) {
                await github.rest.issues.deleteComment({
                  owner,
                  repo,
                  comment_id: comment.id,
                });
              }
              return;
            }
            const failureLines = summaryFailures.length
              ? summaryFailures.map(
                  (failure) =>
                    `- \`${failure.foreground}\` on \`${failure.background}\`: **${failure.ratio}:1** (minimum **${failure.minimum}:1**)`,
                )
              : ['- The audit did not complete successfully.'];
            const body = [
              summaryMarker,
              '## ❌ WCAG contrast audit failed',
              '',
              isFork
                ? 'These failures were found in this fork pull request:'
                : 'These failures could not be attached to a changed token declaration:',
              '',
              ...failureLines,
            ].join('\n');

            const existing = existingSummaryComments.shift();
            for (const duplicate of existingSummaryComments) {
              await github.rest.issues.deleteComment({
                owner,
                repo,
                comment_id: duplicate.id,
              });
            }
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pull_number,
                body,
              });
            }