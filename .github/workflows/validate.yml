name: Site Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate site HTML, links, and structure
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Checkout pull request head for contrast mapping
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: .pr-head

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install browser test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run site validator
        run: python3 scripts/validate-site.py

      - name: Check search index is current
        run: python3 scripts/build-search-index.py --check

      - name: Check shared asset fingerprints
        run: python3 scripts/cache-bust.py --check

      - name: Run comprehensive static audit
        run: python3 scripts/audit-site.py --quiet

      - name: Check internal links and sitemap boundaries
        run: python3 scripts/check-links.py

      - name: Check phone-size overflow on every public page
        run: |
          python3 server.py > server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..20}; do
            if curl --silent --fail http://127.0.0.1:5000/ >/dev/null; then
              break
            fi
            sleep 0.5
          done
          curl --silent --fail http://127.0.0.1:5000/ >/dev/null
          npm run test:phone-overflow
          npm run test:responsive

      - name: Run WCAG contrast audit
        id: contrast
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          css_path="assets/css/theme.css"
          script_path="assets/scripts/check-contrast.py"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            css_path=".pr-head/assets/css/theme.css"
            # Use the base-branch audit implementation for PRs. The PR CSS is
            # treated as data; fork-modified tooling is never run here.
            if ! git fetch --no-tags --depth=1 origin "$BASE_SHA"; then
              printf '%s\n' 'ERROR: could not fetch the trusted contrast checker.' \
                | tee contrast-report.txt
              printf '2\n' > contrast-exit-code.txt
              echo "exit_code=2" >> "$GITHUB_OUTPUT"
              exit 2
            fi
            if ! git show "$BASE_SHA:assets/scripts/check-contrast.py" \
              > "$RUNNER_TEMP/check-contrast.py"; then
              printf '%s\n' 'ERROR: could not load the trusted contrast checker.' \
                | tee contrast-report.txt
              printf '2\n' > contrast-exit-code.txt
              echo "exit_code=2" >> "$GITHUB_OUTPUT"
              exit 2
            fi
            script_path="$RUNNER_TEMP/check-contrast.py"
          fi
          set -o pipefail
          python3 "$script_path" "$css_path" 2>&1 | tee contrast-report.txt
          contrast_exit=$?
          printf '%s\n' "$contrast_exit" > contrast-exit-code.txt
          echo "exit_code=${contrast_exit}" >> "$GITHUB_OUTPUT"
          exit "$contrast_exit"

      - name: Upload contrast audit report for fork pull requests
        if: always() && github.event_name == 'pull_request' && steps.contrast.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: contrast-audit-${{ github.run_id }}
          path: |
            contrast-report.txt
            contrast-exit-code.txt
          if-no-files-found: error
          retention-days: 7

      # Comment publication is deliberately delegated to report-fork-contrast.yml.
      # That workflow runs from the trusted default branch with a write token,
      # while this job remains read-only even when it checks fork content.
      - name: Legacy in-run contrast reporter (disabled)
        if: false
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          CONTRAST_OUTCOME: ${{ steps.contrast.outcome }}
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'contrast-report.txt';
            const report = fs.existsSync(reportPath)
              ? fs.readFileSync(reportPath, 'utf8').trim()
              : '';
            const failedLines = report
              .split('\n')
              .filter((line) => /^\s*FAIL\b/.test(line));
            const auditFailed = process.env.CONTRAST_OUTCOME === 'failure';
            const failurePattern =
              /^\s*FAIL\s+\[([^\]]+)\]\s+(--[\w-]+).*?\s+on\s+(--[\w-]+).*?→\s+([0-9.]+):1\s+\(min\s+([0-9.]+):1/;
            const failures = failedLines
              .map((raw) => {
                const match = raw.match(failurePattern);
                return match && {
                  raw: raw.trim(),
                  theme: match[1],
                  foreground: match[2],
                  background: match[3],
                  ratio: match[4],
                  minimum: match[5],
                };
              })
              .filter(Boolean);

            const { owner, repo } = context.repo;
            const pull_number = context.issue.number;
            const headSha = context.payload.pull_request.head.sha;
            const cssPath = 'assets/css/theme.css';
            const headCssPath = '.pr-head/assets/css/theme.css';
            const cssSourcePath = fs.existsSync(headCssPath) ? headCssPath : cssPath;
            const cssLines = fs.existsSync(cssSourcePath)
              ? fs.readFileSync(cssSourcePath, 'utf8').split('\n')
              : [];

            function changedLinesFromPatch(patch) {
              const changedLines = [];
              let newLine = null;

              for (const patchLine of (patch || '').split('\n')) {
                const hunk = patchLine.match(
                  /^@@ -\d+(?:,\d+)? \+(\d+)(?:,\d+)? @@/,
                );
                if (hunk) {
                  newLine = Number(hunk[1]);
                  continue;
                }
                if (newLine === null) continue;
                if (patchLine.startsWith('+') && !patchLine.startsWith('+++')) {
                  changedLines.push({ line: newLine, text: patchLine.slice(1) });
                  newLine += 1;
                } else if (!patchLine.startsWith('-') && !patchLine.startsWith('\\')) {
                  newLine += 1;
                }
              }
              return changedLines;
            }

            function themeAtLine(lineNumber) {
              for (let index = lineNumber - 1; index >= 0; index -= 1) {
                const sourceLine = cssLines[index];
                if (/:root\[data-theme=["']light["']\]/.test(sourceLine)) {
                  return 'light';
                }
                if (/^\s*:root\s*\{/.test(sourceLine)) return 'dark';
              }
              return null;
            }

            const files = await github.paginate(
              github.rest.pulls.listFiles,
              { owner, repo, pull_number, per_page: 100 },
            );
            const themeFile = files.find((file) => file.filename === cssPath);
            const changedDeclarations = themeFile
              ? changedLinesFromPatch(themeFile.patch)
                  .map(({ line, text }) => {
                    const token = text.match(/^\s*(--[\w-]+)\s*:/)?.[1];
                    const theme = token && themeAtLine(line);
                    return token && theme
                      ? { path: cssPath, line, token, theme }
                      : null;
                  })
                  .filter(Boolean)
              : [];

            const annotationGroups = new Map();
            const unmappedFailures = [];
            for (const failure of failures) {
              const declaration = changedDeclarations.find(
                (candidate) =>
                  candidate.theme === failure.theme &&
                  candidate.token === failure.foreground,
              ) || changedDeclarations.find(
                (candidate) =>
                  candidate.theme === failure.theme &&
                  candidate.token === failure.background,
              );
              if (!declaration) {
                unmappedFailures.push(failure);
                continue;
              }

              const key = `${declaration.theme}:${declaration.token}`;
              if (!annotationGroups.has(key)) {
                annotationGroups.set(key, { declaration, failures: [] });
              }
              annotationGroups.get(key).failures.push(failure);
            }

            const reviewComments = await github.paginate(
              github.rest.pulls.listReviewComments,
              { owner, repo, pull_number, per_page: 100 },
            );
            const inlineMarkerPrefix = '<!-- contrast-audit-inline:';
            const existingInlineComments = reviewComments.filter(
              (comment) =>
                comment.user?.type === 'Bot' &&
                comment.body?.includes(inlineMarkerPrefix),
            );
            const desiredMarkers = new Set();

            for (const [key, group] of annotationGroups) {
              const marker = `<!-- contrast-audit-inline:${key} -->`;
              desiredMarkers.add(marker);
              const body = [
                marker,
                '**WCAG contrast failure**',
                '',
                ...group.failures.map(
                  (failure) =>
                    `- \`${failure.foreground}\` on \`${failure.background}\`: **${failure.ratio}:1** (minimum **${failure.minimum}:1**)`,
                ),
              ].join('\n');
              const matches = existingInlineComments.filter(
                (comment) => comment.body?.includes(marker),
              );
              const existing = matches.shift();

              for (const duplicate of matches) {
                await github.rest.pulls.deleteReviewComment({
                  owner,
                  repo,
                  comment_id: duplicate.id,
                });
              }

              if (
                existing &&
                existing.path === group.declaration.path &&
                existing.line === group.declaration.line &&
                existing.side === 'RIGHT' &&
                existing.commit_id === headSha
              ) {
                await github.rest.pulls.updateReviewComment({
                  owner,
                  repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                if (existing) {
                  await github.rest.pulls.deleteReviewComment({
                    owner,
                    repo,
                    comment_id: existing.id,
                  });
                }
                await github.rest.pulls.createReviewComment({
                  owner,
                  repo,
                  pull_number,
                  body,
                  commit_id: headSha,
                  path: group.declaration.path,
                  line: group.declaration.line,
                  side: 'RIGHT',
                });
              }
            }

            for (const comment of existingInlineComments) {
              const marker = comment.body.match(
                /<!-- contrast-audit-inline:[^>]+ -->/,
              )?.[0];
              if (marker && !desiredMarkers.has(marker)) {
                await github.rest.pulls.deleteReviewComment({
                  owner,
                  repo,
                  comment_id: comment.id,
                });
              }
            }

            const summaryMarker = '<!-- contrast-audit-summary -->';
            const legacySummaryMarker = '<!-- contrast-audit-comment -->';
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number: pull_number, per_page: 100 },
            );
            const existingSummaryComments = comments.filter(
              (comment) =>
                comment.user?.type === 'Bot' &&
                (
                  comment.body?.includes(summaryMarker) ||
                  comment.body?.includes(legacySummaryMarker)
                ),
            );

            if (unmappedFailures.length || (auditFailed && !failures.length)) {
              const fallbackLines = unmappedFailures.length
                ? unmappedFailures.map(
                    (failure) =>
                      `- \`${failure.foreground}\` on \`${failure.background}\`: **${failure.ratio}:1** (minimum **${failure.minimum}:1**)`,
                  )
                : ['- The audit did not complete successfully.'];
              const body = [
                summaryMarker,
                '## ❌ WCAG contrast audit failed',
                '',
                'These failures could not be attached to a changed token declaration:',
                '',
                ...fallbackLines,
              ].join('\n');
              const existing = existingSummaryComments.shift();
              if (existing) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: pull_number,
                  body,
                });
              }
            }

            for (const comment of existingSummaryComments) {
              await github.rest.issues.deleteComment({
                owner,
                repo,
                comment_id: comment.id,
              });
            }

      - name: Fail if contrast audit failed
        if: always() && steps.contrast.outcome == 'failure'
        run: exit 1

  deploy:
    name: Deploy validated site to GitHub Pages
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v7

      - name: Bind generated artifacts to validated commit
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          artifacts = {}
          for public_path in ("sitemap.xml", "assets/data/search-index.json"):
              path = Path(public_path)
              if not path.is_file():
                  raise SystemExit(f"ERROR: generated artifact is missing: {public_path}")
              artifacts[f"/{public_path}"] = {
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
              }

          manifest = {
              "schema": 1,
              "commit": "${{ github.sha }}",
              "artifacts": artifacts,
          }
          output = Path("assets/audit/release-manifest.json")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          print(output)
          print(json.dumps(manifest, indent=2))
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live edge matches validated release
        env:
          DEPLOYED_ORIGIN: ${{ steps.deployment.outputs.page_url }}
          VALIDATED_COMMIT: ${{ github.sha }}
        run: |
          python3 scripts/verify-live-edge.py \
            --base "$DEPLOYED_ORIGIN" \
            --expected-commit "$VALIDATED_COMMIT" \
            --report assets/audit/live-edge-report.json

      - name: Upload live-edge release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-edge-report-${{ github.run_id }}
          path: assets/audit/live-edge-report.json
          if-no-files-found: error
          retention-days: 30

  monitor-live-edge:
    name: Monitor production security and cache policies
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: live-edge-monitor
      cancel-in-progress: true

    steps:
      - name: Checkout monitored release
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Verify production live edge
        id: verify
        continue-on-error: true
        run: |
          python3 scripts/verify-live-edge.py \
            --base https://overkillhill.com \
            --report assets/audit/live-edge-report.json

      - name: Upload live-edge monitoring report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-edge-monitor-${{ github.run_id }}
          path: assets/audit/live-edge-report.json
          if-no-files-found: error
          retention-days: 30

      - name: Classify policy drift separately from external outage
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          report_path = Path("assets/audit/live-edge-report.json")
          try:
              report = json.loads(report_path.read_text(encoding="utf-8"))
          except (OSError, json.JSONDecodeError) as exc:
              raise SystemExit(f"ERROR: live-edge verifier produced no usable report: {exc}")

          status = report.get("status")
          summary = report.get("summary", {})
          print(
              f"Live edge status: {status}; "
              f"checks={summary.get('checks', '?')} "
              f"failures={summary.get('failures', '?')} "
              f"blocked={summary.get('blocked', '?')}"
          )
          if status == "FAILED":
              raise SystemExit(
                  "Production policy drift detected. Inspect the uploaded live-edge report."
              )
          if status == "PARTIAL":
              print(
                  "WARNING: production edge was reachable only partially. "
                  "Blocked checks indicate external unavailability, not a confirmed policy regression."
              )
          elif status != "PASS":
              raise SystemExit(f"ERROR: unexpected live-edge verifier status: {status!r}")
          PY
