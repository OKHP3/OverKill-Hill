name: Site Validation

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-validation-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: Validate site HTML, links, and structure
    if: github.event_name != 'schedule'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Checkout pull request head for contrast mapping
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: .pr-head

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'

      - name: Install Python validation dependencies
        run: python3 -m pip install --disable-pip-version-check --no-input -r requirements-qa.txt

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install browser test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run site validator
        run: python3 scripts/validate-site.py

      - name: Run committed SEO regression fixtures
        run: python3 scripts/test-seo-fixtures.py

      - name: Test the Pages release boundary
        run: python3 tests/test-release-package.py

      - name: Run live-edge and post-merge regression tests
        run: python3 -m unittest tests/test_verify_live_edge.py

      - name: Check public project-status records
        run: python3 scripts/check-project-status.py

      - name: Check generated HTML is current
        run: python3 scripts/build-site.py --check

      - name: Check canonical CSP policies
        run: python3 scripts/check-csp.py

      - name: Check search index is current
        run: python3 scripts/build-search-index.py --check

      - name: Check locale release links and coverage
        run: python3 scripts/check-locale-links.py

      - name: Check shared asset fingerprints
        run: python3 scripts/cache-bust.py --check

      - name: Run comprehensive static audit
        run: python3 scripts/audit-site.py --quiet

      - name: Check internal links and sitemap boundaries
        run: python3 scripts/check-links.py

      - name: Check article external archive destinations
        run: python3 scripts/check-links.py --external-archives

      - name: Check phone-size overflow on every public page
        run: |
          python3 server.py > server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..20}; do
            if curl --silent --fail http://127.0.0.1:5000/ >/dev/null; then
              break
            fi
            sleep 0.5
          done
          curl --silent --fail http://127.0.0.1:5000/ >/dev/null
          npm run test:phone-overflow
          npm run test:responsive

      - name: Run accessibility QA gate
        run: |
          python3 server.py > accessibility-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..20}; do
            if curl --silent --fail http://127.0.0.1:5000/ >/dev/null; then
              break
            fi
            sleep 0.5
          done
          curl --silent --fail http://127.0.0.1:5000/ >/dev/null
          npm run test:accessibility

      - name: Run route-wide CSP browser QA
        run: |
          python3 server.py > csp-qa-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..20}; do
            if curl --silent --fail http://127.0.0.1:5000/ >/dev/null; then
              break
            fi
            sleep 0.5
          done
          curl --silent --fail http://127.0.0.1:5000/ >/dev/null
          npm run test:csp -- --base-url=http://127.0.0.1:5000

      - name: Run CSP fixture regressions
        run: npm run test:csp:regressions

      - name: Run search and embedded-app regressions
        run: node --test tests/search-page.test.mjs tests/search-index.test.mjs tests/embed-workflow.test.mjs

      - name: Run WCAG contrast audit
        id: contrast
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          css_path="assets/css/theme.css"
          script_path="assets/scripts/check-contrast.py"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            css_path=".pr-head/assets/css/theme.css"
            # Use the base-branch audit implementation for PRs. The PR CSS is
            # treated as data; fork-modified tooling is never run here.
            if ! git fetch --no-tags --depth=1 origin "$BASE_SHA"; then
              printf '%s\n' 'ERROR: could not fetch the trusted contrast checker.' \
                | tee contrast-report.txt
              printf '2\n' > contrast-exit-code.txt
              echo "exit_code=2" >> "$GITHUB_OUTPUT"
              exit 2
            fi
            if ! git show "$BASE_SHA:assets/scripts/check-contrast.py" \
              > "$RUNNER_TEMP/check-contrast.py"; then
              printf '%s\n' 'ERROR: could not load the trusted contrast checker.' \
                | tee contrast-report.txt
              printf '2\n' > contrast-exit-code.txt
              echo "exit_code=2" >> "$GITHUB_OUTPUT"
              exit 2
            fi
            script_path="$RUNNER_TEMP/check-contrast.py"
          fi
          set -o pipefail
          python3 "$script_path" "$css_path" 2>&1 | tee contrast-report.txt
          contrast_exit=$?
          printf '%s\n' "$contrast_exit" > contrast-exit-code.txt
          echo "exit_code=${contrast_exit}" >> "$GITHUB_OUTPUT"
          exit "$contrast_exit"

      - name: Upload contrast audit report for fork pull requests
        if: always() && github.event_name == 'pull_request' && steps.contrast.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: contrast-audit-${{ github.run_id }}
          path: |
            contrast-report.txt
            contrast-exit-code.txt
          if-no-files-found: error
          retention-days: 7

      - name: Fail if contrast audit failed
        if: always() && steps.contrast.outcome == 'failure'
        run: exit 1

      - name: Build the SHA-bound Pages release artifact
        if: github.event_name != 'pull_request'
        run: |
          python3 scripts/build-release.py \
            --output site-release \
            --commit "${{ github.sha }}"

      - name: Upload the validated Pages release artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validated-site-${{ github.sha }}
          path: site-release
          if-no-files-found: error
          retention-days: 1

  monitor-third-party-runtime:
    name: Monitor third-party runtime dependencies
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: third-party-runtime-monitor
      cancel-in-progress: true

    steps:
      - name: Checkout monitored release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install browser health-check dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Check deployed third-party runtime dependencies
        id: external-health
        continue-on-error: true
        run: |
          npm run test:csp:external -- \
            --base-url=https://overkillhill.com \
            --report=third-party-runtime-report.json

      - name: Upload third-party runtime inventory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: third-party-runtime-${{ github.run_id }}
          path: third-party-runtime-report.json
          if-no-files-found: error
          retention-days: 30

      - name: Report third-party runtime status without failing validation
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          report_path = Path("third-party-runtime-report.json")
          try:
              report = json.loads(report_path.read_text(encoding="utf-8"))
          except (OSError, json.JSONDecodeError) as exc:
              raise SystemExit(f"ERROR: third-party health check produced no usable report: {exc}")

          summary = report.get("summary", {})
          print(
              f"Third-party runtime status: {report.get('status')}; "
              f"routes={summary.get('routes', '?')} "
              f"dependencies={summary.get('dependencies', '?')} "
              f"available={summary.get('available', '?')} "
              f"external_outages={summary.get('externalOutages', '?')} "
              f"csp_diagnostics={summary.get('cspDiagnostics', '?')} "
              f"local_failures={summary.get('localFailures', '?')}"
          )
          if report.get("externalOutages"):
              print("WARNING: external runtime outages were observed; inspect the uploaded inventory.")
          if report.get("cspDiagnostics"):
              print("WARNING: CSP diagnostics were observed; inspect the CSP gate and uploaded inventory.")
          if report.get("localFailures"):
              print("WARNING: deployed routes failed to load; inspect the uploaded inventory.")
          print("This scheduled health signal is non-blocking by design.")

  monitor-live-edge:
    name: Monitor production security and cache policies
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: live-edge-monitor
      cancel-in-progress: true

    steps:
      - name: Checkout monitored release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'

      - name: Verify production live edge
        id: verify
        continue-on-error: true
        run: |
          python3 scripts/verify-live-edge.py \
            --base https://overkillhill.com \
            --hosting github-pages \
            --accept-blocked \
            --report assets/audit/live-edge-report.json

      - name: Upload live-edge monitoring report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: live-edge-monitor-${{ github.run_id }}
          path: assets/audit/live-edge-report.json
          if-no-files-found: error
          retention-days: 30

      - name: Classify policy drift separately from external outage
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          report_path = Path("assets/audit/live-edge-report.json")
          try:
              report = json.loads(report_path.read_text(encoding="utf-8"))
          except (OSError, json.JSONDecodeError) as exc:
              raise SystemExit(f"ERROR: live-edge verifier produced no usable report: {exc}")

          status = report.get("status")
          summary = report.get("summary", {})
          print(
              f"Live edge status: {status}; "
              f"checks={summary.get('checks', '?')} "
              f"failures={summary.get('failures', '?')} "
              f"blocked={summary.get('blocked', '?')}"
          )
          if status == "FAILED":
              raise SystemExit(
                  "Production policy drift detected. Inspect the uploaded live-edge report."
              )
          if status == "PARTIAL":
              print(
                  "WARNING: production edge was reachable only partially. "
                  "Blocked checks indicate external unavailability, not a confirmed policy regression."
              )
          elif status != "PASS":
              raise SystemExit(f"ERROR: unexpected live-edge verifier status: {status!r}")
          PY
