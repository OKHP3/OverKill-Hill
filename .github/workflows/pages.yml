name: Publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy validated site to GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Bind generated artifacts to validated commit
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          artifacts = {}
          for public_path in ("sitemap.xml", "assets/data/search-index.json"):
              path = Path(public_path)
              if not path.is_file():
                  raise SystemExit(f"ERROR: generated artifact is missing: {public_path}")
              artifacts[f"/{public_path}"] = {
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
              }

          manifest = {
              "schema": 1,
              "commit": "${{ github.sha }}",
              "artifacts": artifacts,
          }
          output = Path("assets/audit/release-manifest.json")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          print(output)
          print(json.dumps(manifest, indent=2))
          PY

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e

      - name: Verify live edge matches validated release
        env:
          DEPLOYED_ORIGIN: ${{ steps.deployment.outputs.page_url }}
          VALIDATED_COMMIT: ${{ github.sha }}
        run: |
          python3 scripts/verify-live-edge.py \
            --base "$DEPLOYED_ORIGIN" \
            --expected-commit "$VALIDATED_COMMIT" \
            --hosting github-pages \
            --accept-blocked \
            --report assets/audit/live-edge-report.json

      - name: Upload live-edge release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: live-edge-report-${{ github.run_id }}
          path: assets/audit/live-edge-report.json
          if-no-files-found: error
          retention-days: 30
