name: Publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate the exact release revision
    uses: ./.github/workflows/validate.yml

  deploy:
    name: Deploy validated site to GitHub Pages
    needs: validate
    # Validation may overlap, but Pages deployments themselves must queue so a
    # newer revision cannot cancel an artifact already being released.
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout the revision validated by this workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}

      - name: Build the explicit public release artifact
        run: |
          python3 scripts/build-release.py \
            --output site-release \
            --commit "${{ github.sha }}"

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: site-release

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e

      - name: Verify live edge matches validated release
        env:
          DEPLOYED_ORIGIN: ${{ steps.deployment.outputs.page_url }}
          VALIDATED_COMMIT: ${{ github.sha }}
        run: |
          python3 scripts/verify-live-edge.py \
            --base "$DEPLOYED_ORIGIN" \
            --expected-commit "$VALIDATED_COMMIT" \
            --hosting github-pages \
            --accept-blocked \
            --report assets/audit/live-edge-report.json

      - name: Upload live-edge release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: live-edge-report-${{ github.run_id }}
          path: assets/audit/live-edge-report.json
          if-no-files-found: error
          retention-days: 30
