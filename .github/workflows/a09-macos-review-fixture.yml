name: A09 macOS Review Fixture

on:
  push:
    branches:
      - 'codex/a09-review-fixture-portability'
  pull_request:
    paths:
      - 'assets/murderbird/v2/**'
      - 'scripts/build-search-index.py'
      - 'tests/test-murderbird-review-boundary.py'
      - 'tests/test-release-package.py'
      - '.github/workflows/a09-macos-review-fixture.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a09-macos-review-fixture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review-fixture:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'

      - name: Install pinned QA dependencies
        run: python3 -m pip install --disable-pip-version-check --no-input -r requirements-qa.txt

      - name: Run A09 review boundary fixture
        run: python3 tests/test-murderbird-review-boundary.py

      - name: Verify release package preservation boundary
        run: python3 tests/test-release-package.py
