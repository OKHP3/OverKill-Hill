version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    open-pull-requests-limit: 10
    schedule:
      interval: daily
      time: "08:00"
      timezone: America/Chicago
    versioning-strategy: increase
    cooldown:
      default-days: 3
    groups:
      python-qa-compatible:
        patterns: ["*"]
        update-types: [minor, patch]

  # Changes to these reproduction pins require an isolated audio rebuild and
  # listening review. Preserve the original delivery and record new provenance.
  - package-ecosystem: pip
    directory: "/assets/murderbird/production/audio/iron-verdict/source"
    open-pull-requests-limit: 10
    schedule:
      interval: daily
      time: "08:15"
      timezone: America/Chicago
    versioning-strategy: increase
    cooldown:
      default-days: 3
    groups:
      audio-production-compatible:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: "/"
    open-pull-requests-limit: 10
    schedule:
      interval: daily
      time: "08:30"
      timezone: America/Chicago
    versioning-strategy: increase
    cooldown:
      default-days: 3
    groups:
      browser-qa-compatible:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    open-pull-requests-limit: 10
    schedule:
      interval: daily
      time: "08:45"
      timezone: America/Chicago
    cooldown:
      default-days: 3
    groups:
      github-actions-compatible:
        patterns: ["*"]
        update-types: [minor, patch]
