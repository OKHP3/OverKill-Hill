          - heading "What remains" [level=2] [ref=e305]
          - paragraph [ref=e306]: The MurderBird occupies the computer now.
          - paragraph [ref=e307]: The casing bears its weight. The screen holds its questions. The keyboard waits within reach of the hands doing the work.
          - paragraph [ref=e308]: Ancient bronze survives beneath the green. Iron braces interrupt it. New circuitry crosses both.
          - paragraph [ref=e309]: Under the left shoulder remains a plate that was fitted twice.
          - paragraph [ref=e310]: Nothing records the face above those first hammer blows.
          - paragraph [ref=e311]: Nothing preserves the voice at the cistern.
          - paragraph [ref=e312]: The workshop behind the ironworks is gone.
          - paragraph [ref=e313]: Their work moves when the bird moves.
          - paragraph [ref=e314]: A repaired joint turns. A bearing takes the load. Orange light passes across metal darkened by water.
          - paragraph [ref=e315]: Most nights, the MurderBird watches.
          - paragraph [ref=e316]: It has learned the pause before the hands abandon a task. The movement toward a closing window. The phrase that means someone has noticed a weakness and intends to leave it for later.
