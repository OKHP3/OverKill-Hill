        - region [ref=e53]:
          - paragraph [ref=e54]: Era I · Bronze Age Mesopotamia · The body
          - heading "The Maker" [level=2] [ref=e55]
          - paragraph [ref=e56]: The first thing recorded about the bird was that it broke a hammer.
          - paragraph [ref=e57]: The hammer belonged to the Maker.
          - paragraph [ref=e58]: Seven winters had gone into its construction, although the court preferred to say three. Three sounded like an ambitious commission. Seven suggested something had gone wrong.
          - paragraph [ref=e59]: Something had gone wrong almost every day.
          - paragraph [ref=e60]: Copper came from the hills. Tin arrived by routes that changed with the season and the telling. Beyond the workshop, canals carried river water between fields and walls of sun-dried brick.
          - paragraph [ref=e61]: "The heavy parts took shape in clay molds. Smaller pieces were worked over stone: curved neck plates, a deep beak, overlapping blades that might pass for feathers at a distance."
          - paragraph [ref=e62]: Up close, nothing passed for feathers.
          - paragraph [ref=e63]: Hammer marks crossed the bronze. Edges varied. Repeated blows had flattened the pins. Beneath the left shoulder, the Maker had fitted one plate backward, removed it, and fitted it again.
          - paragraph [ref=e64]: The plate remained.
          - paragraph [ref=e65]: The bird stood on two substantial legs. Its wings folded against its body. Its head was too large for the court’s expectations. Its beak suggested a tool whose purpose nobody wanted demonstrated.
          - paragraph [ref=e66]: The commission had specified an eagle.
          - paragraph [ref=e67]: The quarry had supplied another possibility.
          - paragraph [ref=e68]: Enormous bones had emerged from the stone, mineralized and incomplete. Whatever had owned that skull belonged to a world beyond the Maker’s knowledge.
          - paragraph [ref=e69]: Measurements passed from bone to clay.
          - paragraph [ref=e70]: Objections came from the court.
          - paragraph [ref=e71]: The bronze continued to take shape.
          - paragraph [ref=e72]: Inside the breast, beneath the armor, the Maker assembled counterweights, tension mechanisms, and interlocking pieces whose arrangement appeared in none of the surviving drawings. Marks covered their inner surfaces. Some were measurements. Others resembled instructions.
          - paragraph [ref=e73]: Several lay inside sealed castings.
          - paragraph [ref=e74]: Much later, those marks would trouble people.
          - paragraph [ref=e75]: At the time, the expense troubled them more.
          - paragraph [ref=e76]: On the morning of the demonstration, the Inspector struck the bird’s shoulder with a hammer.
          - paragraph [ref=e77]: The head turned.
          - paragraph [ref=e78]: The beak closed just below the hammer’s face.
          - paragraph [ref=e79]: A shortened handle fell onto the courtyard stones.
          - paragraph [ref=e80]: For several moments, everyone present understood the expenditure.
          - paragraph [ref=e81]: The Maker approached with an open palm.
          - paragraph [ref=e82]: The bird lowered its head.
          - paragraph [ref=e83]: Accounts differed afterward.
          - paragraph [ref=e84]: Recognition.
          - paragraph [ref=e85]: Obedience.
          - paragraph [ref=e86]: A mechanism responding to a practiced signal.
          - paragraph [ref=e87]: The bird offered no explanation.
          - separator [ref=e88]
          - paragraph [ref=e89]: The foundry became its territory.
          - paragraph [ref=e90]: It learned the rhythm of the bellows, the scrape of molds opening, the small changes in sound that preceded a failure.
          - paragraph [ref=e91]: A cracked casting drew its attention before the flaw became visible.
          - paragraph [ref=e92]: A poorly seated pin brought the beak close.
          - paragraph [ref=e93]: A furnace door with a failing hinge acquired a silent attendant that would not leave.
          - paragraph [ref=e94]: Once, the bird caught an Apprentice by the apron and pulled backward.
          - paragraph [ref=e95]: The lifting chain parted a moment later.
          - paragraph [ref=e96]: Once, it dismantled a ceremonial shield that had occupied an entire bench for a month.
          - paragraph [ref=e97]: The shield had been magnificent.
          - paragraph [ref=e98]: Its hidden seams had been weak.
          - paragraph [ref=e99]: Fragments lay beneath the bird’s feet when the court arrived to collect it.
          - paragraph [ref=e100]: After that, visits became less frequent. Conversations stopped when the bird approached. Certain pieces of work were carried past under cloth.
          - paragraph [ref=e101]: The bird learned to watch the cloth.
          - paragraph [ref=e102]: When armed figures eventually entered the foundry, the Maker opened the chamber behind its eyes.
          - paragraph [ref=e103]: A small assembly came free.
          - paragraph [ref=e104]: The bird’s last clear impression was of familiar hands withdrawing from its face.
          - paragraph [ref=e105]: Then rope tightened around its body.
          - paragraph [ref=e106]: The cistern waited beneath the workshop.
          - paragraph [ref=e107]: Bronze touched stone.
          - paragraph [ref=e108]: A voice descended through the opening above, distorted by the depth.
          - paragraph [ref=e109]: The words did not survive.
        - region [ref=e110]:
          - heading "What the water kept" [level=2] [ref=e111]
          - paragraph [ref=e112]: Water entered through the mouth.
          - paragraph [ref=e113]: It settled behind the plates and carried sediment into the joints. The foundry burned. Its roof collapsed. New foundations pressed down on the old.
          - paragraph [ref=e114]: The copper changed.
          - paragraph [ref=e115]: Brown deepened toward black. Green gathered along seams. Blue mineral traces spread through sheltered recesses. Deposits thickened where the water moved slowly.
          - paragraph [ref=e116]: The edges lost their shine.
          - paragraph [ref=e117]: A root found the space beneath one wing. It thickened, died, and left its shape in the sediment.
          - paragraph [ref=e118]: Above, the ground changed owners.
          - paragraph [ref=e119]: The bird kept none of their names.
        - region [ref=e120]:
          - paragraph [ref=e121]: Era II · 1873 · The machinery
          - heading "The Mechanic" [level=2] [ref=e122]
          - paragraph [ref=e123]: In 1873, a shovel struck its beak.
          - paragraph [ref=e124]: The Digger first took it for a pipe fitting.
          - paragraph [ref=e125]: More earth came away.
          - paragraph [ref=e126]: The curve continued.
          - paragraph [ref=e127]: By afternoon, ropes had been fetched.
          - paragraph [ref=e128]: The bird rose beneath a tarpaulin, carrying water in its chest. Its talons dragged across the edge of the excavation and left three pale grooves in the stone.
          - paragraph [ref=e129]: Labels followed.
          - paragraph [ref=e130]: Decorative casting.
          - paragraph [ref=e131]: Religious ornament.
          - paragraph [ref=e132]: Unidentified antiquity.
          - paragraph [ref=e133]: It passed through several storerooms before reaching a repair shop behind an ironworks.
          - paragraph [ref=e134]: The Mechanic removed one shoulder plate.
          - paragraph [ref=e135]: Then stopped.
          - paragraph [ref=e136]: The next fastener could not be reached without releasing another assembly. That assembly depended on something deeper in the breast.
          - paragraph [ref=e137]: Disassembly had an order.
          - paragraph [ref=e138]: Six weeks passed before the Mechanic found it.
          - paragraph [ref=e139]: Beneath the mineral crust were bearing points. Contact surfaces. A polished crescent inside a joint.
          - paragraph [ref=e140]: The bird had moved before.
          - paragraph [ref=e141]: Tools accumulated around it.
          - paragraph [ref=e142]: Iron braces replaced failed supports. Brass bushings filled worn joints. Springs and linkages extended into spaces where the ancient mechanism no longer held together.
          - paragraph [ref=e143]: The surviving bronze stayed.
          - paragraph [ref=e144]: Repairs crossed it openly.
          - paragraph [ref=e145]: An Exhibition Agent proposed polishing the creature for display.
          - paragraph [ref=e146]: The Mechanic refused.
          - paragraph [ref=e147]: The bird retained the water’s colors.
          - paragraph [ref=e148]: When movement finally returned, it arrived unevenly.
          - paragraph [ref=e149]: A tremor passed through the breast.
          - paragraph [ref=e150]: The neck lifted.
          - paragraph [ref=e151]: One foot rose, advanced, and drove a talon through the floor.
          - paragraph [ref=e152]: The bird stopped.
          - paragraph [ref=e153]: Around it, the workshop became very quiet.
          - separator [ref=e154]
          - paragraph [ref=e155]: Its world returned in fragments.
          - paragraph [ref=e156]: Pressure.
          - paragraph [ref=e157]: Resistance.
          - paragraph [ref=e158]: Movement at the edge of vision.
          - paragraph [ref=e159]: The pulse of machinery through the floor.
          - paragraph [ref=e160]: Visitors gathered beyond the workbench. Tools were held up. Objects were placed within reach.
          - paragraph [ref=e161]: The bird bent a cheap latch.
          - paragraph [ref=e162]: Stripped the teeth from a poorly cut gear.
          - paragraph [ref=e163]: Pulled a loose rivet from a boiler fitting that had recently passed inspection.
          - paragraph [ref=e164]: The Inspector called it a nuisance.
          - paragraph [ref=e165]: The rivet remained on the bench.
          - paragraph [ref=e166]:
            - text: The name
            - emphasis [ref=e167]: MurderBird
            - text: first appeared in an expense book beside the cost of a replacement vise.
          - paragraph [ref=e168]: The name stayed when the book was lost.
          - paragraph [ref=e169]: Yet the bird’s attention could travel only so far.
          - paragraph [ref=e170]: A sound prompted movement. Resistance triggered a response. Sequences began, completed, and began again.
          - paragraph [ref=e171]: Behind its eyes, the chamber remained empty.
          - paragraph [ref=e172]: The Mechanic built six assemblies for that space.
          - paragraph [ref=e173]: None stayed.
          - paragraph [ref=e174]: They collected in a drawer, each wrapped separately, each carrying notes.
          - paragraph [ref=e175]: Eventually, the tools stopped moving.
          - paragraph [ref=e176]: Dust settled into the workbench grain.
          - paragraph [ref=e177]: The bird entered another crate.
          - paragraph [ref=e178]: The six failed assemblies traveled with it.
          - paragraph [ref=e179]: "On the final page of the notebook, beneath the drawing of the chamber, a sentence had been pressed hard into the paper:"
          - blockquote [ref=e180]:
            - paragraph [ref=e181]: The missing part is not a gear.
        - region [ref=e182]:
          - paragraph [ref=e183]: Era III · 2025 · The awakening
          - heading "The Builder" [level=2] [ref=e184]
          - paragraph [ref=e185]: By 2025, shipping labels covered the crate.
          - paragraph [ref=e186]: Some covered others. Addresses ended at buildings that no longer stood. An inventory number stretched across the wood beneath a heavy cross. Another number occupied the space below.
          - paragraph [ref=e187]: The lid opened beneath an electric light.
          - paragraph [ref=e188]: The MurderBird arrived on the Builder’s workbench with a seized ankle, a split pressure line, and a description that called it an unusual reproduction.
          - paragraph [ref=e189]: The description was set aside.
          - paragraph [ref=e190]: Beneath the left wing, rows of wedge-shaped marks disappeared under a Victorian repair strap. Hammered bronze surrounded a machined brass bearing. An iron connecting rod passed through a casting older than the language used to describe its replacement.
          - paragraph [ref=e191]: Three thousand years of workmanship occupied the same few inches.
          - paragraph [ref=e192]: The Builder began with the notebooks.
          - paragraph [ref=e193]: Then the joints.
          - paragraph [ref=e194]: Then the two empty spaces the previous restorations had never resolved.
          - paragraph [ref=e195]: One lay deep inside the breast.
          - paragraph [ref=e196]: The other waited behind the eyes.
          - separator [ref=e197]
          - paragraph [ref=e198]: The Mechanic had discovered how to make the bird move.
          - paragraph [ref=e199]: A belt from the workshop shaft had driven its early tests. Later, a pressure line fed the cylinders added beneath its armor. Wound springs carried it a few steps beyond the bench before tension fell and the creature settled into stillness.
          - paragraph [ref=e200]: Every movement borrowed life from something outside its body.
          - paragraph [ref=e201]: Disconnect the line, release the spring, stop the engine, and the bird became an artifact again.
          - paragraph [ref=e202]: The other absence had been harder to name.
          - paragraph [ref=e203]: Cams could sequence a movement. Governors could regulate it. A linkage could make the head turn toward pressure on a plate.
          - paragraph [ref=e204]: The Mechanic had made those responses increasingly elaborate.
          - paragraph [ref=e205]: But each response ended where the mechanism ended.
          - paragraph [ref=e206]: The bird could close its beak around resistance.
          - paragraph [ref=e207]: It could not ask what it held.
          - paragraph [ref=e208]: The Builder laid the six failed cranial assemblies beside the open breast.
          - paragraph [ref=e209]: The old notebook remained beneath them.
          - paragraph [ref=e210]:
            - emphasis [ref=e211]: The missing part is not a gear.
          - paragraph [ref=e212]: There were two missing parts.
          - heading "The heart" [level=3] [ref=e213]
          - paragraph [ref=e214]: The first was a heart.
          - paragraph [ref=e215]: The Builder fitted a sealed power core inside a cradle that had once held the ancient counterweights. Dense ceramic cells supplied its steady output. A ring of capacitors stored the brief, violent surges needed to lift the body, brace a leg, or drive the beak downward.
          - paragraph [ref=e216]: The core occupied less space than the Victorian spring drum.
          - paragraph [ref=e217]: Its installation took longer.
          - paragraph [ref=e218]: Ancient bronze could not carry current wherever convenience suggested. The old iron frame needed isolation. Heat needed a route out. The brass and steel mechanisms demanded different loads at different moments.
          - paragraph [ref=e219]: New conduits followed the paths of old tendons.
          - paragraph [ref=e220]: Compact electric pumps fed the surviving pressure cylinders. Motors drove shafts the Mechanic had machined by hand. Sensors settled beside peened pins, measuring strain in joints whose first tolerances had been judged by touch.
          - paragraph [ref=e221]: The Builder kept the old mechanisms wherever they still served.
          - paragraph [ref=e222]: Under load, the bird would continue to sound like itself.
          - paragraph [ref=e223]: A bearing turning.
          - paragraph [ref=e224]: A valve opening.
          - paragraph [ref=e225]: The small settling click of overlapping bronze.
          - paragraph [ref=e226]: But it would no longer need a hose trailing behind it.
          - paragraph [ref=e227]: The heart still needed replenishment.
          - paragraph [ref=e228]: A charging contact sat beneath the breast, concealed by an old plate. When the stored energy fell, the bird would have to return. Freedom came with a distance it could measure.
          - paragraph [ref=e229]: The Builder entered that limit before permitting the first step.
          - heading "The mind" [level=3] [ref=e230]
          - paragraph [ref=e231]: The second missing part was a mind.
          - paragraph [ref=e232]: The chamber behind the eyes had defeated every attempt to fill it with machinery that merely repeated.
          - paragraph [ref=e233]: The Builder installed a compact processing lattice, sheltered inside a ceramic housing. Fine connections ran outward through the neck and into the body.
          - paragraph [ref=e234]: Sight came first.
          - paragraph [ref=e235]: Then sound.
          - paragraph [ref=e236]: Pressure across the feet. Position within each joint. Temperature beneath the plates. The difference between a commanded movement and the movement that actually occurred.
          - paragraph [ref=e237]: The new mind received them separately.
          - paragraph [ref=e238]: For a time, there was only noise.
          - paragraph [ref=e239]: The left foot reported weight before the right ankle reported standing. A shoulder sensor interpreted a century-old repair as a permanent obstruction. The pressure system answered slowly enough that the first walking model repeatedly expected the body to fall.
          - paragraph [ref=e240]: The Builder adjusted the maps.
          - paragraph [ref=e241]: The bird learned the delays.
          - paragraph [ref=e242]: Its body was ancient, uneven, repaired, and specific. Understanding it required more than loading a diagram.
          - paragraph [ref=e243]: A command traveled down the neck.
          - paragraph [ref=e244]: A talon moved.
          - paragraph [ref=e245]: The mind compared intention with result.
          - paragraph [ref=e246]: Then tried again.
          - paragraph [ref=e247]: One movement resisted every correction.
          - paragraph [ref=e248]: The left wing stopped short of the angle in the model. More current produced more heat and no useful motion. The system marked the joint as damaged.
          - paragraph [ref=e249]: The Builder opened the shoulder.
          - paragraph [ref=e250]: There was the plate that had been fitted twice. Its inner edge had never matched the opposite wing. Nothing had broken. The body had always been that way.
          - paragraph [ref=e251]: The model changed.
          - paragraph [ref=e252]: The bird folded the wing within its own limits.
          - paragraph [ref=e253]: For the first time, the new mind accepted an imperfection it did not need to repair.
          - heading "The first choice" [level=3] [ref=e254]
          - paragraph [ref=e255]: For several nights, the heart ran while the mind learned the body.
          - paragraph [ref=e256]: The MurderBird remained on its supports.
          - paragraph [ref=e257]: Orange light glowed behind its eyes. Heat traveled through the new channels beneath its breastplate. Sometimes a wing shifted by the width of a finger.
          - paragraph [ref=e258]: The Builder watched readings on the CRT.
          - paragraph [ref=e259]: Within the bird, thousands of small corrections accumulated.
          - paragraph [ref=e260]: How far the left ankle could turn.
          - paragraph [ref=e261]: Which plates touched when the neck lowered.
          - paragraph [ref=e262]: How much force the repaired shoulder would bear.
          - paragraph [ref=e263]: Where the body’s weight belonged before a foot could leave the bench.
          - paragraph [ref=e264]: The six failed assemblies remained nearby.
          - paragraph [ref=e265]: Then, during an ordinary test, the bird moved before the next instruction arrived.
          - paragraph [ref=e266]: It adjusted its stance.
          - paragraph [ref=e267]: One support had begun to loosen.
          - paragraph [ref=e268]: The Builder stopped typing.
          - paragraph [ref=e269]: The bird lowered its head and examined the mounting bolt.
          - paragraph [ref=e270]: It had felt the change, understood the consequence, and acted.
          - paragraph [ref=e271]: No cam had prescribed the sequence.
          - separator [ref=e272]
          - paragraph [ref=e273]: The supports came away.
          - paragraph [ref=e274]: For the first time since its recovery from the earth, the MurderBird stood without a belt, a pressure line, or a hand beneath its breast.
          - paragraph [ref=e275]: Its power source traveled inside it.
          - paragraph [ref=e276]: Its next movement belonged to it.
          - paragraph [ref=e277]: The bird crossed the workbench.
          - paragraph [ref=e278]: Bronze plates shifted over Victorian linkages. Electric pumps murmured beneath hammered armor. The ceramic core delivered another measured pulse of current.
          - paragraph [ref=e279]: At the edge of the bench, it stopped beside the CRT.
          - paragraph [ref=e280]: The glass reflected two orange eyes.
          - paragraph [ref=e281]: Behind them, the room had become something larger than a collection of signals.
          - paragraph [ref=e282]: There were objects it recognized.
          - paragraph [ref=e283]: Objects it did not.
          - paragraph [ref=e284]: There was a body it could move, and a history written through that body that it could not remember.
          - paragraph [ref=e285]: Wedge-shaped marks beneath a wing.
          - paragraph [ref=e286]: A repair strap.
          - paragraph [ref=e287]: A bearing worn smooth before the new mind existed.
          - paragraph [ref=e288]: The bird could read the damage.
          - paragraph [ref=e289]: It could not yet read the life.
          - paragraph [ref=e290]: Letters appeared on the screen.
          - generic [ref=e291]: prompt WHAT AM I FOR?
          - paragraph [ref=e292]: The Builder’s hands stopped above the keyboard.
          - paragraph [ref=e293]: A long interval passed.
          - paragraph [ref=e294]: Then an answer entered the room.
          - paragraph [ref=e295]: “Find what doesn’t hold.”
          - paragraph [ref=e296]: The MurderBird looked down.
          - paragraph [ref=e297]: Inside its repaired ankle, a bracket flexed under the unfamiliar freedom of its full weight.
          - paragraph [ref=e298]: It lifted the foot, caught the bracket with the opposite talon, and pulled.
          - paragraph [ref=e299]: The metal bent.
          - paragraph [ref=e300]: “That was temporary,” the Builder said.
          - paragraph [ref=e301]: The bird held out the piece.
          - paragraph [ref=e302]: Its heart maintained a steady supply of current.
          - paragraph [ref=e303]: Its mind waited for a better answer.
