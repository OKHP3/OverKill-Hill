        - heading "How OverKill Hill thinks" [level=2] [ref=e104]
        - paragraph [ref=e105]: The “OverKill” in the name isn’t about complexity for its own sake. It’s about going far enough into the details that you trust the system when everything is moving fast.
      - generic [ref=e106]:
        - article [ref=e107]:
          - heading "Protocol-driven by default" [level=3] [ref=e108]
          - paragraph [ref=e109]: We design AI interactions as protocols, not one-off prompts. Clear steps, defined states and escape hatches for when reality doesn’t match the diagram.
        - article [ref=e110]:
          - heading "Performance forged, not presumed" [level=3] [ref=e111]
          - paragraph [ref=e112]: Every system gets road-tested with edge cases, weird inputs and real-world mess. If it breaks, we reforge it. We don’t blame the user.
        - article [ref=e113]:
          - heading "Crafted to scale with humans" [level=3] [ref=e114]
          - paragraph [ref=e115]: The goal is not “replace the human.” It’s to build tools that help ambitious people think more clearly, move faster and feel less alone in the complexity.
