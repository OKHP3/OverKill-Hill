<script type="application/ld+json">

      {

        "@context": "https://schema.org",

        "@type": "WebSite",

        "name": "OverKill Hill P³™",

        "url": "https://overkillhill.com",

        "description": "OverKill Hill P³™ is the digital forge for AI systems design: local inference, agentic coordination, and the protocols that make it hold.",

        "potentialAction": {

          "@type": "SearchAction",

          "target": {

            "@type": "EntryPoint",

            "urlTemplate": "https://overkillhill.com/search/?q={search_term_string}"

          },

          "query-input": "required name=search_term_string"

        }

      }

    </script>
<script type="module">

      import mermaid from "/assets/vendor/mermaid/mermaid.esm.min.mjs";

      const allowedClickTargets = [
        ["https://glee-fully.tools", /^\/(?:|toolbox(?:\/|$))/],
        ["https://askjamie.bot", /^\/lens-system(?:\/|$)/],
        ["https://overkillhill.com", /^\/(?:|projects\/|writings\/)/],
      ];
      const sanitizeClickTargets = (source) =>
        source.replace(
          /^(\s*click\s+\S+\s+)"([^"]+)"(?:\s+"[^"]*")?(?:\s+\S+)?\s*$/gm,
          (line, prefix, target) => {
            try {
              const url = new URL(target);
              return url.protocol === "https:" &&
                allowedClickTargets.some(
                  ([origin, path]) => url.origin === origin && path.test(url.pathname)
                )
                ? line
                : "%% Removed disallowed click target";
            } catch {
              return "%% Removed disallowed click target";
            }
          }
        );

      document.querySelectorAll(".mermaid").forEach((node) => {
        node.textContent = sanitizeClickTargets(node.textContent);
      });



      // Use the dedicated --mermaid-* tokens from :root — hardcoded OKH dark values

      // that do NOT flip in light mode, so node/text contrast stays correct in both themes.

      const styles = getComputedStyle(document.documentElement);



      const primary    = styles.getPropertyValue("--mermaid-primary-color").trim()        || "#111827";

      const primaryTxt = styles.getPropertyValue("--mermaid-primary-text-color").trim()   || "#e5e7eb";

      const primaryBdr = styles.getPropertyValue("--mermaid-primary-border-color").trim() || "#c46a2c";

      const lineColor  = styles.getPropertyValue("--mermaid-line-color").trim()           || "#c46a2c";

      const secondary  = styles.getPropertyValue("--mermaid-secondary-color").trim()      || "#181f26";

      const tertiary   = styles.getPropertyValue("--mermaid-tertiary-color").trim()       || "#1c3a34";

      const fontBody   = styles.getPropertyValue("--font-body").trim()                    ||

        '"DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif';



      mermaid.initialize({

        startOnLoad: true,

        securityLevel: "loose",   // required for clickable links in diagrams

        theme: "base",

        themeVariables: {

          primaryColor:       primary,

          primaryTextColor:   primaryTxt,

          primaryBorderColor: primaryBdr,

          lineColor:          lineColor,

          secondaryColor:     secondary,

          tertiaryColor:      tertiary,

          textColor:          primaryTxt,

          fontFamily:         fontBody,

          noteBkgColor:       primary,

          noteTextColor:      primaryTxt

        },

        flowchart: {

          curve: "basis",

          nodeSpacing: 60,

          rankSpacing: 70

        }

      });

    </script>
