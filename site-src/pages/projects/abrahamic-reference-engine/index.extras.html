<script>
      (function () {
        var btn = document.getElementById('are-reload-btn');
        var iframe = document.getElementById('are-tool-iframe');
        var overlay = document.getElementById('are-iframe-overlay');
        var fallback = document.getElementById('are-iframe-fallback');

        if (!iframe) return;

        var slowTimer = null;

        function showLoading() {
          if (overlay) overlay.classList.remove('loaded');
          if (fallback) fallback.classList.remove('visible');
          clearTimeout(slowTimer);
          slowTimer = setTimeout(function () {
            if (fallback) fallback.classList.add('visible');
          }, 8000);
        }

        function hideLoading() {
          clearTimeout(slowTimer);
          if (overlay) overlay.classList.add('loaded');
          if (fallback) fallback.classList.remove('visible');
        }

        iframe.addEventListener('load', hideLoading);

        if (btn) {
          btn.addEventListener('click', function () {
            showLoading();
            iframe.src = iframe.src;
          });
        }

        showLoading();
      })();
    </script>
