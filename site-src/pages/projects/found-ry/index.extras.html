<script>
      (function () {
        var btn = document.getElementById('foundry-reload-btn');
        var iframe = document.getElementById('foundry-tool-iframe');
        var overlay = document.getElementById('foundry-iframe-overlay');
        var fallback = document.getElementById('foundry-iframe-fallback');

        if (!iframe) return;

        var slowTimer = null;

        function showLoading() {
          if (overlay) overlay.classList.remove('loaded');
          if (fallback) fallback.classList.remove('visible');
          clearTimeout(slowTimer);
          slowTimer = setTimeout(function () {
            if (fallback) fallback.classList.add('visible');
          }, 8000);
        }

        function hideLoading() {
          clearTimeout(slowTimer);
          if (overlay) overlay.classList.add('loaded');
          if (fallback) fallback.classList.remove('visible');
        }

        iframe.addEventListener('load', hideLoading);

        if (btn) {
          btn.addEventListener('click', function () {
            showLoading();
            iframe.src = iframe.src;
          });
        }

        showLoading();
      })();
    </script>
<script type="module">
      import mermaid from "/assets/vendor/mermaid/mermaid.esm.min.mjs";

      const styles = getComputedStyle(document.body);

      const surface = styles.getPropertyValue("--color-surface").trim() || "#111827";
      const surfaceSoft = styles.getPropertyValue("--color-surface-soft").trim() || "#181f26";
      const fg = styles.getPropertyValue("--color-fg").trim() || "#e5e7eb";
      const accent = styles.getPropertyValue("--color-accent").trim() || "#c46a2c";
      const muted = styles.getPropertyValue("--color-muted").trim() || "#6b7280";
      const fontBody =
        styles.getPropertyValue("--font-body").trim() ||
        '"DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif';

      mermaid.initialize({
        startOnLoad: true,
        securityLevel: "strict",
        theme: "base",
        themeVariables: {
          primaryColor: surface,
          primaryTextColor: fg,
          primaryBorderColor: accent,
          lineColor: accent,
          secondaryColor: surfaceSoft,
          tertiaryColor: surfaceSoft,
          textColor: fg,
          fontFamily: fontBody,
          noteBkgColor: surface,
          noteTextColor: muted
        },
        flowchart: {
          curve: "basis",
          nodeSpacing: 60,
          rankSpacing: 70
        }
      });
    </script>
