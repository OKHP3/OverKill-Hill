<script>
      (function () {
        var btn = document.getElementById('bpmn-reload-btn');
        var iframe = document.getElementById('bpmn-tool-iframe');
        var overlay = document.getElementById('bpmn-iframe-overlay');
        var fallback = document.getElementById('bpmn-iframe-fallback');

        if (!iframe) return;

        var slowTimer = null;

        function showLoading() {
          if (overlay) overlay.classList.remove('loaded');
          if (fallback) fallback.classList.remove('visible');
          clearTimeout(slowTimer);
          slowTimer = setTimeout(function () {
            if (fallback) fallback.classList.add('visible');
          }, 8000);
        }

        function hideLoading() {
          clearTimeout(slowTimer);
          if (overlay) overlay.classList.add('loaded');
          if (fallback) fallback.classList.remove('visible');
        }

        iframe.addEventListener('load', hideLoading);

        if (btn) {
          btn.addEventListener('click', function () {
            showLoading();
            iframe.src = iframe.src;
          });
        }

        showLoading();
      })();
    </script>
<script>
      (function () {
        var btn = document.getElementById('dsl-copy-btn');
        if (!btn) return;
        btn.addEventListener('click', function () {
          var raw = [
            'bpmn-beta',
            'accTitle: Purchase Order Approval',
            '',
            'pool company "Company" {',
            '  lane requester "Requester" {',
            '    start     s1  "Need Identified"',
            '    task:user t1  "Submit Purchase Request"',
            '  }',
            '',
            '  lane manager "Manager" {',
            '    task:user t2  "Review Request"',
            '    xor       g1  "Approved?"',
            '    end       e2  "Rejected"',
            '  }',
            '',
            '  lane procurement "Procurement" {',
            '    task:service t3  "Create Purchase Order"',
            '    end          e1  "PO Issued"',
            '  }',
            '',
            '  s1 --> t1',
            '  t1 --> t2',
            '  t2 --> g1',
            '  g1 --> t3: "yes"',
            '  g1 --> e2: "no"',
            '  t3 --> e1',
            '}'
          ].join('\n');
          if (navigator.clipboard) {
            navigator.clipboard.writeText(raw).then(function () {
              btn.textContent = '✓ Copied';
              setTimeout(function () { btn.textContent = '⎘ Copy'; }, 2000);
            });
          }
        });
      })();
    </script>
